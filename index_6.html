<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Deck Analyzer</title>
<!--FONTS--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"><!--/FONTS-->
<style>
:root {
  --bg: #0b0e13; --panel: #121722; --panel-2: #171e2c; --line: #232c3d; --text: #e7ebf3; --muted: #8b95a8; --faint: #5b6578;
  --a: #55c8de; --b: #ee7b5f; --gold: #e3b04b; --good: #6fd39b; --bad: #ee7b5f;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Barlow Condensed", "Arial Narrow", "Barlow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
h1 { font-family: var(--font-head); font-weight: 700; font-size: 36px; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 4px; }
h2 { font-family: var(--font-head); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; margin: 28px 0 10px; }
h3 { font-family: var(--font-head); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.sub { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
button, select, input[type=text], input[type=search], textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; }
button { cursor: pointer; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
button:hover, select:hover { border-color: var(--faint); }
button.primary { background: var(--gold); border-color: var(--gold); color: #0b0e13; }
button.ghost { background: transparent; }
textarea { width: 100%; min-height: 150px; font: 13px/1.5 var(--font-mono); resize: vertical; }
label.inline { color: var(--muted); font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }

.bar-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.status { color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; margin-left: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; background: transparent; user-select: none; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(227,176,75,.08); }
.chip small { color: var(--faint); font-family: var(--font-mono); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 20px 0 18px; overflow-x: auto; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); font-family: var(--font-head); font-weight: 600; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
.note { color: var(--muted); font-size: 13.5px; max-width: 80ch; margin: 6px 0 14px; }
.empty { color: var(--faint); padding: 16px 0; }

table.data { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.data th, table.data td { padding: 7px 12px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.data th { font-family: var(--font-head); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--muted); border-top: 0; background: var(--panel-2); }
table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; }
table.data td.num { font-family: var(--font-mono); font-size: 13px; }
.tablewrap { overflow-x: auto; margin-bottom: 14px; }
a.link, .link { color: var(--a); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; font: inherit; text-transform: none; letter-spacing: 0; font-weight: 500; }
.link:hover { text-decoration: underline; }
.good { color: var(--good); } .badc { color: var(--bad); } .dim { color: var(--faint); }
.meter { display: inline-block; vertical-align: middle; width: 70px; height: 6px; border-radius: 3px; background: #1b2332; overflow: hidden; margin-right: 8px; }
.meter i { display: block; height: 100%; background: var(--a); }
.split { display: inline-flex; vertical-align: middle; width: 90px; height: 8px; border-radius: 3px; overflow: hidden; background: #1b2332; }
.split i:nth-child(1) { background: #496a8a; } .split i:nth-child(2) { background: #55c8de; } .split i:nth-child(3) { background: #e3b04b; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 10px 0 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-family: var(--font-head); font-weight: 700; font-size: 30px; line-height: 1.1; }
.tile .k { color: var(--muted); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.panel h3:first-child { margin-top: 2px; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list .meta { color: var(--faint); font-size: 12.5px; }
.pl { font-family: var(--font-mono); font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.pl.top { border-color: var(--gold); color: var(--gold); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 12.5px; padding: 1px 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); }
.tag.add { border-color: rgba(111,211,155,.5); color: var(--good); } .tag.rem { border-color: rgba(238,123,95,.5); color: var(--bad); } .tag.chg { border-color: rgba(227,176,75,.5); color: var(--gold); }
.step { border-left: 2px solid var(--line); padding: 4px 0 4px 14px; margin: 0 0 14px 6px; }

.cardref { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.art { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 4px; overflow: hidden; display: none; }
.art.on { display: block; border: 1px solid var(--line); }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
[data-card] { cursor: default; }
.artpreview { position: fixed; z-index: 60; width: 220px; pointer-events: none; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.6); border: 1px solid var(--line); background: var(--panel); }
.artpreview[hidden] { display: none; }
.artpreview img { width: 100%; display: block; }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(4,6,9,.75); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.modal[hidden] { display: none; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 760px; padding: 18px 20px; }
.sheet header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sheet h2 { margin: 0 0 4px; }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 18px; }
.cardgrid .it { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.cardgrid .it b { font-family: var(--font-mono); font-weight: 500; color: var(--gold); width: 22px; flex: 0 0 auto; }
.cb { color: var(--muted); font-size: 13px; }
@media (max-width: 800px) { .two { grid-template-columns: 1fr; } h1 { font-size: 28px; } .status { margin-left: 0; } }


</style>
</head>
<body>
<div class="wrap">
  <h1>Deck Analyzer</h1>
  <p class="sub">Load the decks you saved from Format Library and look at the whole field of an event, not just the top cut. Everything stays in your browser.</p>

  <div class="bar-card">
    <div class="row">
      <button class="primary" id="pick" type="button">Load deck files</button>
      <input type="file" id="file" accept=".json,application/json" multiple hidden>
      <button id="example" type="button">Use example data (made up)</button>
      <button class="ghost" id="clear" type="button">Clear</button>
      <span class="status" id="status" role="status"></span>
    </div>
    <div id="evrow" hidden><div class="chips" id="chips" aria-label="Events"></div></div>
  </div>

  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <div id="out"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<script>
/**
 * Deck analysis for tournament decklists. Pure logic, no DOM, so it runs in the
 * website and under Node for tests.
 *
 * Input: deck records as saved by the extension (the raw deck response from
 * Format Library). normalizeDeck() turns one into
 *   { id, event, eventName, name, builderId, builder, placement, date,
 *     main:{card:copies}, extra:{...}, side:{...}, passcodes:{card:passcode} }
 * "name" is the deck name (Warrior, Chaos Turbo, ...), not an archetype.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.DeckAnalysis = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ---------- reading decks ----------

  function countCards(list, passcodes) {
    var out = {};
    (list || []).forEach(function (c) {
      if (c == null) return;
      var name = typeof c === "string" ? c : c.name;
      if (!name) return;
      var n = 1;
      if (typeof c === "object") {
        var q = c.count != null ? c.count : c.copies != null ? c.copies : c.quantity != null ? c.quantity : c.amount != null ? c.amount : c.qty;
        if (q != null && isFinite(+q) && +q > 0) n = +q;
        var code = c.artworkId != null ? c.artworkId : c.passcode;
        if (passcodes && code != null && !passcodes[name]) passcodes[name] = String(code);
      }
      out[name] = (out[name] || 0) + n;
    });
    return out;
  }

  function sum(o) { var t = 0; for (var k in o) t += o[k]; return t; }

  function normalizeDeck(raw) {
    if (!raw || raw.id == null) return null;
    var passcodes = {};
    var ev = raw.event || {};
    return {
      id: raw.id,
      event: raw.eventAbbreviation || ev.abbreviation || "?",
      eventName: ev.name || raw.eventAbbreviation || "?",
      eventId: raw.eventId != null ? raw.eventId : ev.id,
      name: raw.deckTypeName || raw.name || "Unknown",
      builderId: raw.builderId || raw.builderName || "unknown",
      builder: raw.builderName || (raw.builder && raw.builder.name) || "Unknown",
      placement: raw.placement != null ? +raw.placement : null,
      date: raw.publishDate || raw.updatedAt || null,
      format: raw.formatName || null,
      main: countCards(raw.main, passcodes),
      extra: countCards(raw.extra, passcodes),
      side: countCards(raw.side, passcodes),
      passcodes: passcodes
    };
  }

  // Merges decks by id; a later copy of the same deck replaces the earlier one.
  function mergeDecks(existing, incoming) {
    var byId = {};
    (existing || []).forEach(function (d) { byId[d.id] = d; });
    (incoming || []).forEach(function (d) { if (d) byId[d.id] = d; });
    return Object.keys(byId).map(function (k) { return byId[k]; });
  }

  // ---------- events ----------

  function eventsOf(decks) {
    var map = {};
    decks.forEach(function (d) {
      var e = map[d.event] || (map[d.event] = { abbr: d.event, name: d.eventName, size: 0, date: null, ids: d.eventId });
      e.size++;
      if (d.date && (!e.date || d.date < e.date)) e.date = d.date;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      return (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : (a.abbr < b.abbr ? -1 : 1);
    });
  }

  function filterEvents(decks, abbrs) {
    if (!abbrs || !abbrs.length) return decks;
    var set = {};
    abbrs.forEach(function (a) { set[a] = true; });
    return decks.filter(function (d) { return set[d.event]; });
  }

  function sizeByEvent(decks) {
    var s = {};
    decks.forEach(function (d) { s[d.event] = (s[d.event] || 0) + 1; });
    return s;
  }

  // ---------- the field: share and conversion per deck name ----------

  // conversion at N = (share of the top N that played this deck) / (share of the whole field that played it).
  // Above 1 means the deck did better than its popularity; below 1 means worse.
  function fieldStats(decks, cuts) {
    cuts = cuts || [8, 16, 32];
    var total = decks.length;
    var cutTotals = {};
    cuts.forEach(function (n) { cutTotals[n] = decks.filter(function (d) { return d.placement != null && d.placement <= n; }).length; });
    var rows = {};
    decks.forEach(function (d) {
      var r = rows[d.name] || (rows[d.name] = { name: d.name, count: 0, top: {}, placements: [], best: null });
      r.count++;
      if (d.placement != null) {
        r.placements.push(d.placement);
        if (r.best == null || d.placement < r.best) r.best = d.placement;
        cuts.forEach(function (n) { if (d.placement <= n) r.top[n] = (r.top[n] || 0) + 1; });
      }
    });
    return Object.keys(rows).map(function (k) {
      var r = rows[k];
      r.share = total ? r.count / total : 0;
      r.avgPlacement = r.placements.length ? r.placements.reduce(function (a, b) { return a + b; }, 0) / r.placements.length : null;
      r.conv = {};
      cuts.forEach(function (n) {
        var inTop = r.top[n] || 0;
        r.top[n] = inTop;
        r.conv[n] = cutTotals[n] && r.share ? (inTop / cutTotals[n]) / r.share : null;
      });
      return r;
    }).sort(function (a, b) { return b.count - a.count || (a.name < b.name ? -1 : 1); });
  }

  // ---------- one deck name: core and flex cards, best lists ----------

  function cardTable(decks, zone) {
    var rows = {};
    decks.forEach(function (d) {
      var z = d[zone] || {};
      Object.keys(z).forEach(function (c) {
        var r = rows[c] || (rows[c] = { name: c, decks: 0, copies: { 1: 0, 2: 0, 3: 0 }, total: 0 });
        r.decks++;
        r.total += z[c];
        var k = Math.min(3, z[c]);
        r.copies[k] = (r.copies[k] || 0) + 1;
      });
    });
    return Object.keys(rows).map(function (k) {
      var r = rows[k];
      r.pct = decks.length ? r.decks / decks.length : 0;
      r.avgCopies = r.total / r.decks;
      return r;
    }).sort(function (a, b) { return b.decks - a.decks || (a.name < b.name ? -1 : 1); });
  }

  // core = in at least coreAt of the lists, flex = the rest
  function coreFlex(decks, zone, coreAt) {
    coreAt = coreAt == null ? 0.8 : coreAt;
    var t = cardTable(decks, zone);
    return { core: t.filter(function (r) { return r.pct >= coreAt; }), flex: t.filter(function (r) { return r.pct < coreAt; }) };
  }

  function relPlacement(d, sizes) {
    return d.placement != null && sizes[d.event] ? d.placement / sizes[d.event] : 1;
  }

  // Best finishes first. Across events the finish is compared as a fraction of the field.
  function bestLists(decks, sizes, n) {
    return decks.slice().sort(function (a, b) {
      return relPlacement(a, sizes) - relPlacement(b, sizes) || (a.placement || 1e9) - (b.placement || 1e9);
    }).slice(0, n || 10);
  }

  // ---------- one card ----------

  function cardUsage(decks, card, sizes) {
    var key = card.toLowerCase();
    var has = [], without = [];
    decks.forEach(function (d) {
      var found = false;
      ["main", "side", "extra"].forEach(function (z) { Object.keys(d[z]).forEach(function (c) { if (c.toLowerCase() === key) found = true; }); });
      (found ? has : without).push(d);
    });
    function avgRel(list) {
      if (!list.length) return null;
      return list.reduce(function (s, d) { return s + relPlacement(d, sizes); }, 0) / list.length;
    }
    var byDeck = {};
    has.forEach(function (d) { byDeck[d.name] = (byDeck[d.name] || 0) + 1; });
    var copies = { main: { 0: 0, 1: 0, 2: 0, 3: 0 }, side: { 0: 0, 1: 0, 2: 0, 3: 0 } };
    decks.forEach(function (d) {
      ["main", "side"].forEach(function (z) {
        var n = 0;
        Object.keys(d[z]).forEach(function (c) { if (c.toLowerCase() === key) n += d[z][c]; });
        copies[z][Math.min(3, n)]++;
      });
    });
    var perEvent = {};
    var evSizes = sizeByEvent(decks);
    has.forEach(function (d) { perEvent[d.event] = (perEvent[d.event] || 0) + 1; });
    return {
      card: card,
      decks: has.length,
      pct: decks.length ? has.length / decks.length : 0,
      avgRelWith: avgRel(has),
      avgRelWithout: avgRel(without),
      byDeck: Object.keys(byDeck).map(function (k) { return { name: k, count: byDeck[k] }; }).sort(function (a, b) { return b.count - a.count; }),
      copies: copies,
      perEvent: Object.keys(evSizes).map(function (e) { return { event: e, count: perEvent[e] || 0, size: evSizes[e], pct: (perEvent[e] || 0) / evSizes[e] }; }),
      best: bestLists(has, sizes, 5)
    };
  }

  function allCardNames(decks) {
    var set = {};
    decks.forEach(function (d) { ["main", "side", "extra"].forEach(function (z) { Object.keys(d[z]).forEach(function (c) { set[c] = (set[c] || 0) + 1; }); }); });
    return Object.keys(set).sort(function (a, b) { return set[b] - set[a] || (a < b ? -1 : 1); });
  }

  // ---------- comparing two events ----------

  function usageMap(decks, zones) {
    var m = {};
    decks.forEach(function (d) {
      var seen = {};
      zones.forEach(function (z) { Object.keys(d[z]).forEach(function (c) { seen[c] = true; }); });
      Object.keys(seen).forEach(function (c) { m[c] = (m[c] || 0) + 1; });
    });
    return m;
  }

  function compareEvents(a, b, opts) {
    opts = opts || {};
    var minSupport = opts.minSupport || 3;
    var fa = fieldStats(a), fb = fieldStats(b);
    var names = {};
    fa.concat(fb).forEach(function (r) { names[r.name] = true; });
    var shareA = {}, shareB = {}, bestA = {}, bestB = {};
    fa.forEach(function (r) { shareA[r.name] = r.share; bestA[r.name] = r.best; });
    fb.forEach(function (r) { shareB[r.name] = r.share; bestB[r.name] = r.best; });
    var decksRows = Object.keys(names).map(function (n) {
      return { name: n, shareA: shareA[n] || 0, shareB: shareB[n] || 0, delta: (shareB[n] || 0) - (shareA[n] || 0), bestA: bestA[n] == null ? null : bestA[n], bestB: bestB[n] == null ? null : bestB[n] };
    }).sort(function (x, y) { return Math.abs(y.delta) - Math.abs(x.delta); });

    var ua = usageMap(a, ["main", "side"]), ub = usageMap(b, ["main", "side"]);
    var cards = {};
    Object.keys(ua).concat(Object.keys(ub)).forEach(function (c) { cards[c] = true; });
    var cardRows = Object.keys(cards).map(function (c) {
      var pa = a.length ? (ua[c] || 0) / a.length : 0, pb = b.length ? (ub[c] || 0) / b.length : 0;
      return { name: c, pctA: pa, pctB: pb, delta: pb - pa, countA: ua[c] || 0, countB: ub[c] || 0 };
    }).filter(function (r) { return r.countA >= minSupport || r.countB >= minSupport; });
    return {
      sizeA: a.length, sizeB: b.length,
      decks: decksRows,
      risers: cardRows.slice().sort(function (x, y) { return y.delta - x.delta; }).slice(0, 15),
      fallers: cardRows.slice().sort(function (x, y) { return x.delta - y.delta; }).slice(0, 15)
    };
  }

  // ---------- players ----------

  function diffDecks(prev, next) {
    function diffZone(a, b) {
      var added = [], removed = [], changed = [];
      Object.keys(b).forEach(function (c) {
        if (!a[c]) added.push({ name: c, copies: b[c] });
        else if (a[c] !== b[c]) changed.push({ name: c, from: a[c], to: b[c] });
      });
      Object.keys(a).forEach(function (c) { if (!b[c]) removed.push({ name: c, copies: a[c] }); });
      return { added: added, removed: removed, changed: changed };
    }
    return { sameDeckName: prev.name === next.name, main: diffZone(prev.main, next.main), side: diffZone(prev.side, next.side) };
  }

  function players(decks) {
    var map = {};
    decks.forEach(function (d) {
      var p = map[d.builderId] || (map[d.builderId] = { id: d.builderId, names: {}, decks: [] });
      p.names[d.builder] = true;
      p.decks.push(d);
    });
    return Object.keys(map).map(function (k) {
      var p = map[k];
      p.name = Object.keys(p.names).join(" / ");
      p.decks.sort(function (a, b) { return (a.date || "") < (b.date || "") ? -1 : (a.date || "") > (b.date || "") ? 1 : 0; });
      return p;
    });
  }

  function playerHistory(decks, builderId) {
    var p = players(decks).filter(function (x) { return x.id === builderId; })[0];
    if (!p) return null;
    var steps = [];

// Card pictures for the analyzer. Looks each card name up on YGOPRODeck once,
// remembers the answer in localStorage, and never blocks the page: if a lookup
// or an image fails, the text row simply stays text.
(function (root) {
  "use strict";
  var API = "https://db.ygoprodeck.com/api/v7/cardinfo.php?name=";
  var IMG = "https://images.ygoprodeck.com/images/";
  var KEY = "duel-log-analyzer-cardids-v1";
  var MAX_PARALLEL = 4;

  var ids = {};          // lower-case name -> numeric id, or 0 when YGOPRODeck has no such card
  var pending = {};      // lower-case name -> true while a lookup is running
  var waiting = [];      // names queued for lookup
  var running = 0;
  var listeners = [];

  try { ids = JSON.parse(root.localStorage.getItem(KEY) || "{}") || {}; } catch (e) { ids = {}; }
  function save() { try { root.localStorage.setItem(KEY, JSON.stringify(ids)); } catch (e) {} }

  function thumbUrl(id) { return IMG + "cards_cropped/" + id + ".jpg"; }
  function fullUrl(id) { return IMG + "cards/" + id + ".jpg"; }

  function pump() {
    while (running < MAX_PARALLEL && waiting.length) {
      (function (name) {
        running++;
        var key = name.toLowerCase();
        root.fetch(API + encodeURIComponent(name))
          .then(function (r) {
            // YGOPRODeck answers 400 for a name it does not know: remember that as "no art".

          })

            save();
          })
          .catch(function () { /* network trouble: leave it unknown, try again next page load */ })
          .then(function () {
            delete pending[key];
            running--;
            listeners.forEach(function (f) { f(); });
            pump();
          });
      })(waiting.shift());
    }
  }

  function want(name) {
    var key = String(name).toLowerCase();
    if (key in ids || pending[key]) return;
    pending[key] = true;
    waiting.push(name);
  }

    thumbUrl: thumbUrl,
    fullUrl: fullUrl,

    onUpdate: function (f) { listeners.push(f); },

      var els = rootEl.querySelectorAll("[data-card]");
      Array.prototype.forEach.call(els, function (el) {
        var name = el.getAttribute("data-card");
        var id = CardArt.idFor(name);

  }

  function loadFiles(files) {
    var list = Array.prototype.slice.call(files);
    var added = [], bad = [], left = list.length;
    if (!left) return;
    list.forEach(function (f) {
      var r = new FileReader();
      r.onload = function () {
        try {
          rawDecksFrom(JSON.parse(r.result)).forEach(function (raw) { var d = A.normalizeDeck(raw); if (d) added.push(d); });
        } catch (e) { bad.push(f.name); }
        if (--left === 0) finishLoad(added, bad);
      };
      r.onerror = function () { bad.push(f.name); if (--left === 0) finishLoad(added, bad); };
      r.readAsText(f);
    });
  }
  function finishLoad(added, bad) {
    var merged = A.mergeDecks(S.decks, added);
    $("status").textContent = added.length + " decks read" + (bad.length ? ", could not read: " + bad.join(", ") : "");
    setDecks(merged);
  }

  // ---------- views ----------
  function viewField(decks) {
    var rows = A.fieldStats(decks, [8, 16, 32]);
    var h = '<p class="note">Share is how much of the field played the deck. Conversion at 8 is the deck\'s share of the top 8 divided by its share of the field. Above 1.0 it made the cut more often than its popularity suggests.</p>';
    h += '<div class="tablewrap"><table class="data"><thead><tr><th>Deck</th><th>Decks</th><th>Share</th><th>Top 8</th><th>Top 16</th><th>Top 32</th><th>Conv 8</th><th>Conv 16</th><th>Conv 32</th><th>Avg place</th><th>Best</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      function cv(n) { var v = r.conv[n]; return v == null ? '<span class="dim">n/a</span>' : '<span class="' + (v >= 1.2 ? "good" : v < 0.8 ? "badc" : "") + '">' + v.toFixed(2) + "</span>"; }
      h += '<tr><td><button class="link" data-deckname="' + esc(r.name) + '">' + esc(r.name) + '</button></td><td class="num">' + r.count + '</td><td class="num"><span class="meter"><i style="width:' + Math.min(100, r.share * 100 * 3) + '%"></i></span>' + pct(r.share, 1) + "</td>" +
        '<td class="num">' + r.top[8] + '</td><td class="num">' + r.top[16] + '</td><td class="num">' + r.top[32] + '</td><td class="num">' + cv(8) + '</td><td class="num">' + cv(16) + '</td><td class="num">' + cv(32) + '</td><td class="num">' + (r.avgPlacement == null ? "?" : r.avgPlacement.toFixed(1)) + '</td><td class="num">' + (r.best == null ? "?" : r.best) + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  function cardRows(rows, limit) {
    return '<div class="tablewrap"><table class="data"><thead><tr><th>Card</th><th>In decks</th><th>Share</th><th>Copies</th><th>Avg</th></tr></thead><tbody>' +
      rows.slice(0, limit || 60).map(function (r) {
        return "<tr><td>" + card(r.name) + '</td><td class="num">' + r.decks + '</td><td class="num"><span class="meter"><i style="width:' + (r.pct * 100) + '%"></i></span>' + pct(r.pct) + "</td><td>" + copiesSplit(r.copies) + '</td><td class="num">' + r.avgCopies.toFixed(1) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function viewDeck(decks) {
    var names = A.fieldStats(decks).map(function (r) { return r.name; });
    if (!names.length) return '<div class="empty">No decks in the selected events.</div>';
    if (!S.deckName || names.indexOf(S.deckName) === -1) S.deckName = names[0];
    var g = decks.filter(function (d) { return d.name === S.deckName; });
    var st = A.fieldStats(decks).filter(function (r) { return r.name === S.deckName; })[0];
    var h = '<div class="row"><select id="deckSel">' + names.map(function (n) { return '<option' + (n === S.deckName ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") +
      '</select><label class="inline">Core means in at least <select id="coreSel">' + [60, 70, 80, 90, 100].map(function (n) { return '<option value="' + n + '"' + (S.coreAt * 100 === n ? " selected" : "") + ">" + n + "%</option>"; }).join("") + "</select> of the lists</label></div>";
    h += '<div class="tiles"><div class="tile"><div class="v">' + g.length + '</div><div class="k">Lists</div></div><div class="tile"><div class="v">' + pct(st.share, 1) + '</div><div class="k">Of the field</div></div><div class="tile"><div class="v">' + (st.best == null ? "?" : plc(st.best)) + '</div><div class="k">Best finish</div></div><div class="tile"><div class="v">' + (st.conv[8] == null ? "n/a" : st.conv[8].toFixed(2)) + '</div><div class="k">Conversion at 8</div></div></div>';

    h += "<h2>Best lists</h2>";
    h += '<ul class="list panel">' + A.bestLists(g, sizes(), 8).map(function (d) {
      return "<li>" + plTag(d) + '<span class="grow">' + deckLink(d, esc(d.builder)) + ' <span class="meta">' + esc(d.event) + "</span></span></li>";
    }).join("") + "</ul>";

    var cm = A.coreFlex(g, "main", S.coreAt), cs = A.cardTable(g, "side");
    h += "<h2>Main deck</h2>";
    h += '<h3>Core cards (' + cm.core.length + ")</h3>" + (cm.core.length ? cardRows(cm.core, 60) : '<div class="empty">No card reaches that share.</div>');
    h += "<h3>Flex cards (" + cm.flex.length + ")</h3>" + (cm.flex.length ? cardRows(cm.flex, 40) : '<div class="empty">None.</div>');
    h += "<h2>Side deck</h2>" + (cs.length ? cardRows(cs, 40) : '<div class="empty">No side decks recorded.</div>');
    return h;
  }

  function viewCard(decks) {
    var names = A.allCardNames(decks);
    var h = '<div class="row"><input type="search" id="cardIn" list="cardList" placeholder="Type a card name" value="' + esc(S.card) + '" style="min-width:300px"><datalist id="cardList">' +
      names.slice(0, 2500).map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + "</datalist></div>";
    if (!S.card) return h + '<div class="empty">Pick a card to see who plays it and how those decks finished.</div>';
    var match = names.filter(function (n) { return n.toLowerCase() === S.card.toLowerCase(); })[0];
    if (!match) {
      var near = names.filter(function (n) { return n.toLowerCase().indexOf(S.card.toLowerCase()) !== -1; }).slice(0, 12);
      return h + '<div class="empty">No exact match.' + (near.length ? " Did you mean: " + near.map(function (n) { return '<button class="link" data-pickcard="' + esc(n) + '">' + esc(n) + "</button>"; }).join(", ") + "?" : "") + "</div>";
    }
    var u = A.cardUsage(decks, match, sizes());
    h += "<h2>" + card(match) + "</h2>";
    h += '<div class="tiles"><div class="tile"><div class="v">' + u.decks + '</div><div class="k">Decks playing it</div></div><div class="tile"><div class="v">' + pct(u.pct, 1) + '</div><div class="k">Of the field</div></div>' +
      '<div class="tile"><div class="v">' + (u.avgRelWith == null ? "n/a" : pct(u.avgRelWith)) + '</div><div class="k">Avg finish with it (lower is better)</div></div><div class="tile"><div class="v">' + (u.avgRelWithout == null ? "n/a" : pct(u.avgRelWithout)) + '</div><div class="k">Avg finish without it</div></div></div>';
    h += '<p class="note">Finish is shown as a share of the field, so 10% means the top tenth. A better finish with a card does not prove the card is the reason.</p>';
    h += '<div class="two"><div class="panel"><h3>In which decks</h3><ul class="list">' + u.byDeck.map(function (b) { return '<li><span class="grow"><button class="link" data-deckname="' + esc(b.name) + '">' + esc(b.name) + '</button></span><span class="pl">' + b.count + "</span></li>"; }).join("") + "</ul></div>" +
      '<div class="panel"><h3>Per event</h3><ul class="list">' + u.perEvent.map(function (e) { return '<li><span class="grow">' + esc(e.event) + '</span><span class="meter"><i style="width:' + e.pct * 100 + '%"></i></span><span class="pl">' + e.count + " of " + e.size + " (" + pct(e.pct) + ")</span></li>"; }).join("") + "</ul></div></div>";
    h += '<div class="two" style="margin-top:16px"><div class="panel"><h3>Main deck copies</h3><ul class="list">' + [0, 1, 2, 3].map(function (n) { return '<li><span class="grow">' + (n === 0 ? "Not in the main deck" : n + (n === 1 ? " copy" : n === 3 ? " copies" : " copies")) + '</span><span class="pl">' + u.copies.main[n] + "</span></li>"; }).join("") + "</ul></div>" +
      '<div class="panel"><h3>Side deck copies</h3><ul class="list">' + [0, 1, 2, 3].map(function (n) { return '<li><span class="grow">' + (n === 0 ? "Not in the side deck" : n + " " + (n === 1 ? "copy" : "copies")) + '</span><span class="pl">' + u.copies.side[n] + "</span></li>"; }).join("") + "</ul></div></div>";
    h += "<h2>Best finishes with it</h2><ul class=\"list panel\">" + u.best.map(function (d) { return "<li>" + plTag(d) + '<span class="grow">' + deckLink(d, esc(d.name)) + ' <span class="meta">' + who(d) + "</span></span></li>"; }).join("") + "</ul>";
    return h;
  }

  function viewCompare() {
    if (S.events.length < 2) return '<div class="empty">Load at least two events to compare them.</div>';
    function sel(id, val) { return '<select id="' + id + '">' + S.events.map(function (e) { return '<option value="' + esc(e.abbr) + '"' + (e.abbr === val ? " selected" : "") + ">" + esc(e.abbr) + " (" + e.size + " decks)</option>"; }).join("") + "</select>"; }
    var h = '<div class="row"><label class="inline">From ' + sel("cmpA", S.cmpA) + '</label><label class="inline">to ' + sel("cmpB", S.cmpB) + "</label></div>";
    var a = S.decks.filter(function (d) { return d.event === S.cmpA; }), b = S.decks.filter(function (d) { return d.event === S.cmpB; });
    if (S.cmpA === S.cmpB) return h + '<div class="empty">Pick two different events.</div>';
    var c = A.compareEvents(a, b, { minSupport: 3 });
    h += "<h2>Deck share</h2>";
    h += '<div class="tablewrap"><table class="data"><thead><tr><th>Deck</th><th>' + esc(S.cmpA) + "</th><th>" + esc(S.cmpB) + "</th><th>Change</th><th>Best " + esc(S.cmpA) + "</th><th>Best " + esc(S.cmpB) + "</th></tr></thead><tbody>" +
      c.decks.map(function (r) {
        var cls = r.delta > 0.005 ? "good" : r.delta < -0.005 ? "badc" : "dim";
        return '<tr><td><button class="link" data-deckname="' + esc(r.name) + '">' + esc(r.name) + '</button></td><td class="num">' + pct(r.shareA, 1) + '</td><td class="num">' + pct(r.shareB, 1) + '</td><td class="num ' + cls + '">' + (r.delta > 0 ? "+" : "") + (r.delta * 100).toFixed(1) + ' pts</td><td class="num">' + (r.bestA == null ? "none" : r.bestA) + '</td><td class="num">' + (r.bestB == null ? "none" : r.bestB) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    function cl(list) {
      return '<ul class="list">' + list.map(function (r) { return '<li><span class="grow">' + card(r.name) + '</span><span class="meta">' + pct(r.pctA) + " to " + pct(r.pctB) + '</span><span class="pl ' + (r.delta > 0 ? "top" : "") + '">' + (r.delta > 0 ? "+" : "") + (r.delta * 100).toFixed(0) + " pts</span></li>"; }).join("") + "</ul>";
    }
    h += '<h2>Cards in the main or side deck</h2><p class="note">Share of decks that run the card, cards seen in at least 3 decks of either event.</p><div class="two"><div class="panel"><h3>Rising</h3>' + cl(c.risers) + '</div><div class="panel"><h3>Falling</h3>' + cl(c.fallers) + "</div></div>";
    return h;
  }

  function diffTags(d) {
    var h = "";
    h += tagList(d.added, "add", function (x) { return "+" + x.copies + " " + x.name; });
    h += tagList(d.removed, "rem", function (x) { return "-" + x.copies + " " + x.name; });
    h += tagList(d.changed, "chg", function (x) { return x.name + " " + x.from + " to " + x.to; });
    return h;
  }

  function viewPlayers() {
    var ps = A.players(S.decks).sort(function (a, b) { return b.decks.length - a.decks.length || (a.name < b.name ? -1 : 1); });
    var q = S.playerQuery.toLowerCase();
    var shown = ps.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 80);
    var h = '<div class="row"><input type="search" id="plQ" placeholder="Search a player" value="' + esc(S.playerQuery) + '"><select id="plSel"><option value="">Choose a player</option>' +
      shown.map(function (p) { return '<option value="' + esc(p.id) + '"' + (p.id === S.player ? " selected" : "") + ">" + esc(p.name) + " (" + p.decks.length + (p.decks.length === 1 ? " deck" : " decks") + ")</option>"; }).join("") + "</select></div>";
    if (!S.player) return h + '<div class="empty">Players with more than one deck are listed first, so you can see what they changed between events.</div>';
    var hist = A.playerHistory(S.decks, S.player);
    if (!hist) return h;
    h += "<h2>" + esc(hist.player.name) + "</h2>";
    h += '<div class="step">' + hist.player.decks.map(function (d, i) {
      var step = i > 0 ? hist.steps[i - 1] : null;
      var out = '<div>' + plTag(d) + " <b>" + esc(d.event) + "</b> " + deckLink(d, esc(d.name)) + " </div>";
      if (step) {
        var df = step.diff;
        out += '<div class="cb">' + (df.sameDeckName ? "Same deck as last time." : "Switched deck from " + esc(step.from.name) + ".") + "</div>";
        out += '<div class="cb">Main deck</div>' + (diffTags(df.main) || '<div class="cb dim">No changes.</div>');
        out += '<div class="cb">Side deck</div>' + (diffTags(df.side) || '<div class="cb dim">No changes.</div>');
      }
      return '<div style="margin-bottom:16px">' + out + "</div>";
    }).join("") + "</div>";
    return h;
  }

  function viewWeird(decks) {
    if (decks.length < 10) return '<div class="empty">Load more decks first. This needs a decent number of lists to know what is normal.</div>';
    var rare = A.rareCards(decks, S.rareMax);
    var h = '<div class="row"><label class="inline">Rare means played in at most <select id="rareSel">' + [1, 2, 3, 5].map(function (n) { return '<option value="' + n + '"' + (S.rareMax === n ? " selected" : "") + ">" + n + (n === 1 ? " deck" : " decks") + "</option>"; }).join("") + "</select></label></div>";
    h += "<h2>Rarest cards (" + rare.length + ")</h2>";
    h += rare.length ? '<ul class="list panel">' + rare.slice(0, 40).map(function (r) {
      return '<li><span class="grow">' + card(r.name) + '<div class="meta">' + r.decks.map(function (d) { return deckLink(d, esc(d.builder) + " (" + esc(d.name) + ", " + plc(d.placement) + ")"); }).join(" · ") + "</div></span></li>";
    }).join("") + "</ul>" : '<div class="empty">Nothing that rare in this selection.</div>';
    var wz = A.weirdness(decks, 12);
    h += '<h2>Strangest decks</h2><p class="note">Each list is scored by how unusual its cards are compared with every other list loaded. The cards that pull the score up are shown.</p><ul class="list panel">' + wz.map(function (w) {
      return "<li>" + plTag(w.deck) + '<span class="grow">' + deckLink(w.deck, esc(w.deck.name)) + ' <span class="meta">' + who(w.deck) + '</span><div class="tags">' + w.odd.map(function (o) { return '<span class="tag" data-card="' + esc(o.name) + '">' + esc(o.name) + " (" + o.decks + ")</span>"; }).join("") + '</div></span><span class="pl">' + w.score.toFixed(2) + "</span></li>";
    }).join("") + "</ul>";
    var dv = A.deviation(decks, 5, 12);
    h += '<h2>Furthest from the usual list</h2><p class="note">Compared with the cards most lists of the same deck name play. Only deck names with at least 5 lists are checked.</p><ul class="list panel">' + dv.map(function (r) {
      return "<li>" + plTag(r.deck) + '<span class="grow">' + deckLink(r.deck, esc(r.deck.name)) + ' <span class="meta">' + who(r.deck) + " of " + r.group + " lists</span>" + tagList(r.extras.slice(0, 6).map(function (n) { return { name: n }; }), "add", function (x) { return "+" + x.name; }) + tagList(r.missing.slice(0, 6).map(function (n) { return { name: n }; }), "rem", function (x) { return "-" + x.name; }) + '</span><span class="pl">' + pct(r.distance) + "</span></li>";
    }).join("") + "</ul>";
    return h;
  }

  function viewSimilar(decks) {
    var h = '<p class="note">Paste your list as a ydke link, a .ydk file or lines like "3 Jar of Greed". Passcodes only work for cards that appear in the loaded decks.</p>' +
      '<textarea id="paste" placeholder="ydke://...   or   3 Jar of Greed">' + esc(S.pasted) + '</textarea><div class="row" style="margin-top:8px"><button class="primary" id="simGo" type="button">Find similar decks</button></div>';
    if (S.similar) {
      var s = S.similar;
      if (s.error) h += '<div class="empty">' + esc(s.error) + "</div>";
      else {
        h += "<h2>Closest lists</h2>" + (s.unknown ? '<p class="note">' + s.unknown + " card codes were not recognised and are left out.</p>" : "") + '<ul class="list panel">' + s.rows.map(function (r) {
          return "<li>" + plTag(r.deck) + '<span class="grow">' + deckLink(r.deck, esc(r.deck.name)) + ' <span class="meta">' + who(r.deck) + "</span>" +
            (r.theyRun.length ? '<div class="cb">They run, you do not</div>' + tagList(r.theyRun.slice(0, 10), "add", function (x) { return "+" + x.copies + " " + x.name; }) : "") +
            (r.youRun.length ? '<div class="cb">You run, they do not</div>' + tagList(r.youRun.slice(0, 10), "rem", function (x) { return "-" + x.copies + " " + x.name; }) : "") +
            '</span><span class="pl top">' + pct(r.sim) + "</span></li>";
        }).join("") + "</ul>";
      }
    }
    return h;
  }

  // ---------- deck sheet ----------
  function openDeck(id) {
    var d = S.decks.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!d) return;
    function zone(title, z) {
      var keys = Object.keys(z).sort(function (a, b) { return z[b] - z[a] || (a < b ? -1 : 1); });
      if (!keys.length) return "";
      return "<h3>" + title + " (" + keys.reduce(function (s, k) { return s + z[k]; }, 0) + ')</h3><div class="cardgrid">' + keys.map(function (k) { return '<div class="it"><b>' + z[k] + "x</b>" + card(k) + "</div>"; }).join("") + "</div>";
    }
    $("sheet").innerHTML = '<header><div><h2>' + esc(d.name) + '</h2><div class="cb">' + esc(d.builder) + " &middot; " + plc(d.placement) + " at " + esc(d.event) + '</div></div><button class="ghost" id="closeSheet" type="button">Close</button></header>' +
      zone("Main deck", d.main) + zone("Extra deck", d.extra) + zone("Side deck", d.side);
    $("modal").hidden = false;
    if (window.CardArt) CardArt.decorate($("sheet"));
  }

  // ---------- page ----------
  var TABS = [["field", "Field"], ["deck", "Deck"], ["card", "Card"], ["compare", "Compare events"], ["players", "Players"], ["weird", "Weird"], ["similar", "Find similar"]];

  function render() {
    var has = S.decks.length > 0;
    $("chips").innerHTML = S.events.map(function (e) { return '<button class="chip" type="button" data-ev="' + esc(e.abbr) + '" aria-pressed="' + !!S.picked[e.abbr] + '">' + esc(e.abbr) + " <small>" + e.size + "</small></button>"; }).join("");
    $("evrow").hidden = !has;
    $("tabs").hidden = !has;
    $("tabs").innerHTML = TABS.map(function (t) { return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + "</button>"; }).join("");
    var out = $("out");
    if (!has) {
      out.innerHTML = '<div class="empty">No decks loaded yet. Load the file saved by the extension, or try the example data to see how everything looks.</div>';
      $("status").textContent = $("status").textContent || "";
      return;
    }
    $("status").textContent = S.decks.length + " decks, " + S.events.length + (S.events.length === 1 ? " event" : " events");
    var decks = view();
    var h;
    if (!decks.length && S.tab !== "compare" && S.tab !== "players") h = '<div class="empty">Pick at least one event above.</div>';
    else if (S.tab === "field") h = viewField(decks);
    else if (S.tab === "deck") h = viewDeck(decks);
    else if (S.tab === "card") h = viewCard(decks);
    else if (S.tab === "compare") h = viewCompare();
    else if (S.tab === "players") h = viewPlayers();
    else if (S.tab === "weird") h = viewWeird(decks);
    else h = viewSimilar(decks);
    var keep = document.activeElement && document.activeElement.id;
    var pos = keep && document.activeElement.selectionStart;
    out.innerHTML = h;
    if (keep && $(keep) && /^(cardIn|plQ)$/.test(keep)) { $(keep).focus(); try { $(keep).setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }
    if (window.CardArt) CardArt.decorate(out);
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target;
    var el;
    if ((el = t.closest("[data-tab]"))) { S.tab = el.getAttribute("data-tab"); render(); return; }
    if ((el = t.closest("[data-ev]"))) { var k = el.getAttribute("data-ev"); S.picked[k] = !S.picked[k]; render(); return; }
    if ((el = t.closest("[data-deckname]"))) { S.deckName = el.getAttribute("data-deckname"); S.tab = "deck"; render(); window.scrollTo(0, 0); return; }
    if ((el = t.closest("[data-open]"))) { openDeck(el.getAttribute("data-open")); return; }
    if ((el = t.closest("[data-pickcard]"))) { S.card = el.getAttribute("data-pickcard"); render(); return; }
    if (t.id === "closeSheet" || t.id === "modal") { $("modal").hidden = true; return; }
    if (t.id === "simGo") {
      S.pasted = $("paste").value;
      var parsed = A.parseList(S.pasted, A.passcodeMap(S.decks));
      var total = Object.keys(parsed.main).reduce(function (s, k) { return s + parsed.main[k]; }, 0);
      if (!total) S.similar = { error: "No cards could be read from that. Check the format, or load decks that include those cards." };
      else S.similar = { rows: A.findSimilar(parsed.main, view(), 10), unknown: parsed.unknown.length };
      render();
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "deckSel") { S.deckName = t.value; render(); }
    else if (t.id === "coreSel") { S.coreAt = +t.value / 100; render(); }
    else if (t.id === "cmpA") { S.cmpA = t.value; render(); }
    else if (t.id === "cmpB") { S.cmpB = t.value; render(); }
    else if (t.id === "plSel") { S.player = t.value || null; render(); }
    else if (t.id === "rareSel") { S.rareMax = +t.value; render(); }
    else if (t.id === "cardIn") { S.card = t.value.trim(); render(); }
    else if (t.id === "file") { loadFiles(t.files); t.value = ""; }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "plQ") { S.playerQuery = e.target.value; render(); }
    else if (e.target.id === "cardIn" && e.target.value.trim().length > 2) {
      var v = e.target.value.trim();
      if (A.allCardNames(view()).some(function (n) { return n.toLowerCase() === v.toLowerCase(); })) { S.card = v; render(); }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") $("modal").hidden = true;
    if (e.key === "Enter" && e.target.id === "cardIn") {
      var v = e.target.value.trim().toLowerCase();
      var hit = A.allCardNames(view()).filter(function (n) { return n.toLowerCase().indexOf(v) !== -1; })[0];
      if (v && hit) { S.card = hit; render(); }
    }
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

  $("example").addEventListener("click", function () {
    var raw = window.SampleData.build();
    setDecks(raw.decks.map(A.normalizeDeck));
    $("status").textContent = "Example data loaded. All of it is made up.";
  });
  $("clear").addEventListener("click", function () { setDecks([]); $("status").textContent = ""; });
  $("pick").addEventListener("click", function () { $("file").click(); });

  if (window.CardArt) {
    CardArt.enablePreview(document.body);
    CardArt.onUpdate(function () { CardArt.decorate(document.body); });
  }
  restore(render);
})();

</script>
</body>
</html>
